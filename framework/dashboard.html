<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SynactJS Dashboard Example</title>
  <script src="./synact.js"></script>
  <script src="./lib/synact.lib.js"></script>
</head>

<body>
  <div id="app"></div>

  <script>
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randomPick(values) {
      return values[randomInt(0, values.length - 1)];
    }

    function createMockDashboardData(days) {
      const statuses = ["paid", "pending", "refunded"];
      const channels = ["Organic", "Email", "Paid Ads", "Referral", "Direct"];
      const customers = [
        "Acme Corp", "Globex", "Initech", "Umbrella", "Soylent", "Stark Industries", "Wayne Tech", "Wonka"
      ];

      const revenueSeries = Array.from({ length: days }, () => randomInt(4500, 14000));

      const channelStats = channels.map((channel) => {
        const sessions = randomInt(900, 8500);
        const conversionRate = randomInt(12, 64) / 10;
        const revenue = Math.round(sessions * (conversionRate / 100) * randomInt(90, 180));
        return {
          channel,
          sessions,
          conversionRate: conversionRate.toFixed(1) + "%",
          revenue: "$" + revenue.toLocaleString()
        };
      });

      const orders = Array.from({ length: 20 }, (_, index) => {
        const total = randomInt(80, 2400);
        return {
          id: "ORD-" + (1040 + index),
          customer: randomPick(customers),
          status: randomPick(statuses),
          total,
          totalLabel: "$" + total.toLocaleString(),
          date: new Date(Date.now() - randomInt(0, days - 1) * 86400000).toISOString().slice(0, 10)
        };
      });

      return { revenueSeries, channelStats, orders };
    }

    function Dashboard() {
      const [range, setRange] = useState("7d");
      const [statusFilter, setStatusFilter] = useState("all");
      const [dataset, setDataset] = useState(() => createMockDashboardData(7));
      const [showSettings, setShowSettings] = useState(false);
      const [uploadedFiles, setUploadedFiles] = useState([]);
      const online = useOnlineStatus();
      const [notes, setNotes] = useLocalStorage("synact-dashboard-notes", "");
      const notePreview = useDebouncedValue(notes, 300);

      useEffect(() => {
        const nextDays = range === "30d" ? 30 : 7;
        setDataset(createMockDashboardData(nextDays));
      }, [range]);

      const totals = useMemo(() => {
        const revenue = dataset.revenueSeries.reduce((sum, amount) => sum + amount, 0);
        const orderCount = dataset.orders.length;
        const paidOrders = dataset.orders.filter((o) => o.status === "paid").length;
        const avgOrder = orderCount === 0 ? 0 : Math.round(dataset.orders.reduce((sum, o) => sum + o.total, 0) / orderCount);

        return {
          revenue,
          orderCount,
          paidRate: orderCount === 0 ? 0 : Math.round((paidOrders / orderCount) * 100),
          avgOrder
        };
      }, [dataset]);

      const visibleOrders = useMemo(() => {
        if (statusFilter === "all") return dataset.orders;
        return dataset.orders.filter((order) => order.status === statusFilter);
      }, [dataset.orders, statusFilter]);

      return SynactLib.AppShell({
        title: "Operations Dashboard",
        subtitle: "SynactJS + expanded SynactLib (mock data + browser-powered components).",
        actions: [
          SynactLib.ThemeToggle({}),
          SynactLib.NetworkStatusBadge({}),
          SynactLib.ClipboardButton({ text: window.location.href, label: "Copy URL" }),
          SynactLib.ShareButton({ data: { title: "Synact Dashboard", text: "Check this dashboard", url: window.location.href } }),
          SynactLib.Button({ variant: "primary", onClick: () => setDataset(createMockDashboardData(range === "30d" ? 30 : 7)) }, "Refresh Data"),
          SynactLib.Button({ onClick: () => setShowSettings(true) }, "Settings")
        ],
        children: [
          SynactLib.Alert({
            tone: online ? "success" : "warning",
            title: online ? "Network Connected" : "Offline Mode",
            children: online ? "Live APIs and sharing are available." : "Some browser capabilities may be unavailable while offline."
          }),

          div({ style: "display:flex;gap:12px;flex-wrap:wrap;margin:14px 0;" },
            SynactLib.SelectField({
              label: "Range",
              value: range,
              onChange: (event) => setRange(event.target.value),
              options: [
                { value: "7d", label: "Last 7 days" },
                { value: "30d", label: "Last 30 days" }
              ]
            }),
            SynactLib.SelectField({
              label: "Order status",
              value: statusFilter,
              onChange: (event) => setStatusFilter(event.target.value),
              options: [
                { value: "all", label: "All" },
                { value: "paid", label: "Paid" },
                { value: "pending", label: "Pending" },
                { value: "refunded", label: "Refunded" }
              ]
            }),
            SynactLib.Switch({
              label: "Show settings modal",
              checked: showSettings,
              onChange: setShowSettings
            })
          ),

          SynactLib.Grid({
            children: [
              SynactLib.StatCard({
                label: "Revenue",
                value: "$" + totals.revenue.toLocaleString(),
                delta: range === "30d" ? "+12.8%" : "+4.2%",
                tone: "positive",
                footer: range === "30d" ? "vs previous 30 days" : "vs previous week"
              }),
              SynactLib.StatCard({
                label: "Orders",
                value: totals.orderCount,
                delta: "+6.1%",
                tone: "positive",
                footer: "new orders"
              }),
              SynactLib.StatCard({
                label: "Paid Rate",
                value: totals.paidRate + "%",
                delta: totals.paidRate >= 70 ? "healthy" : "watch",
                tone: totals.paidRate >= 70 ? "positive" : "neutral",
                footer: "share of paid orders"
              }),
              SynactLib.Card({
                title: "Sync Progress",
                children: SynactLib.Progress({
                  label: "Data Sync",
                  value: totals.paidRate,
                  max: 100
                }),
                footer: "Example progress primitive"
              })
            ]
          }),

          div({ style: "margin-top:14px;" },
            SynactLib.Grid({
              min: 320,
              children: [
                SynactLib.Card({
                  title: "Revenue Trend",
                  children: SynactLib.SparkBars({ values: dataset.revenueSeries }),
                  footer: range === "30d" ? "Daily mock revenue (30 points)" : "Daily mock revenue (7 points)"
                }),
                SynactLib.Card({
                  title: "Traffic Sources",
                  children: SynactLib.DataTable({
                    columns: [
                      { key: "channel", label: "Channel" },
                      { key: "sessions", label: "Sessions" },
                      { key: "conversionRate", label: "Conv." },
                      { key: "revenue", label: "Revenue" }
                    ],
                    rows: dataset.channelStats
                  })
                })
              ]
            })
          ),

          div({ style: "margin-top:14px;" },
            SynactLib.Tabs({
              items: [
                {
                  id: "orders",
                  label: "Orders",
                  content: SynactLib.DataTable({
                    columns: [
                      { key: "id", label: "Order" },
                      { key: "customer", label: "Customer" },
                      { key: "status", label: "Status" },
                      { key: "totalLabel", label: "Total" },
                      { key: "date", label: "Date" }
                    ],
                    rows: visibleOrders,
                    emptyText: "No orders match this filter."
                  })
                },
                {
                  id: "files",
                  label: "Files",
                  content: SynactLib.Stack({
                    children: [
                      SynactLib.FileDropzone({
                        label: "Drop CSV reports here",
                        hint: "or click to browse local files",
                        multiple: true,
                        onFiles: (files) => setUploadedFiles(files.map((file) => ({ name: file.name, size: file.size })))
                      }),
                      uploadedFiles.length === 0
                        ? SynactLib.EmptyState({ title: "No uploads", description: "Upload one or more files to preview metadata." })
                        : SynactLib.DataTable({
                          columns: [
                            { key: "name", label: "File" },
                            {
                              key: "size",
                              label: "Size",
                              render: (value) => (Math.round(value / 1024) + " KB")
                            }
                          ],
                          rows: uploadedFiles
                        })
                    ]
                  })
                },
                {
                  id: "browser",
                  label: "Browser APIs",
                  content: SynactLib.Stack({
                    children: [
                      SynactLib.GeolocationCard({ title: "Current Location" }),
                      SynactLib.Textarea({
                        label: "Persistent Notes (saved in localStorage)",
                        value: notes,
                        onInput: (event) => setNotes(event.target.value),
                        placeholder: "Type notes and refresh the page..."
                      }),
                      SynactLib.Card({
                        title: "Debounced Preview",
                        children: notePreview || "No notes yet.",
                        footer: "Preview updates with useDebouncedValue."
                      })
                    ]
                  })
                }
              ]
            })
          ),

          SynactLib.Modal({
            open: showSettings,
            title: "Dashboard Settings",
            onClose: () => setShowSettings(false),
            children: SynactLib.Accordion({
              items: [
                {
                  id: "theme",
                  title: "Theme & UX",
                  content: SynactLib.Stack({
                    children: [
                      SynactLib.ThemeToggle({}),
                      div({}, "Keyboard hint: ", SynactLib.Kbd({ children: "Ctrl + K" }))
                    ]
                  })
                },
                {
                  id: "status",
                  title: "System Status",
                  content: SynactLib.Stack({
                    children: [
                      SynactLib.NetworkStatusBadge({}),
                      SynactLib.Alert({
                        tone: online ? "success" : "warning",
                        title: online ? "Connected" : "Disconnected",
                        children: online ? "Everything looks good." : "Reconnect to sync live data."
                      })
                    ]
                  })
                }
              ]
            }),
            actions: SynactLib.Toolbar({
              children: [
                SynactLib.Button({ variant: "ghost", onClick: () => setShowSettings(false) }, "Close"),
                SynactLib.Button({ variant: "primary", onClick: () => setShowSettings(false) }, "Save")
              ]
            })
          })
        ]
      });
    }

    SynactJS.configure({ errorMode: "console", logErrors: true });
    SynactJS.render(Dashboard, "app");
  </script>
</body>

</html>
