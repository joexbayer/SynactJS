<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>SynactJS Mini App</title>
    <style>
        :root {
            color-scheme: light;

            /*
              App styling tokens:
              Change these to reskin the app without touching JS.
            */
            --mini-primary: #2563eb;
            --mini-surface: #ffffff;
            --mini-text: #0f172a;
            --mini-bg: #f8fafc;
            --mini-border: #cbd5e1;
            --mini-note-bg: #eff6ff;
            --mini-note-border: #bfdbfe;
            --mini-note-text: #1e3a8a;

            /* Bridge tokens into SynactLib theme variables */
            --synact-primary: var(--mini-primary);
            --synact-surface: var(--mini-surface);
            --synact-text: var(--mini-text);
            --synact-bg: var(--mini-bg);
            --synact-border: var(--mini-border);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 20% 0%, color-mix(in srgb, var(--mini-primary) 20%, transparent), transparent 30%),
                linear-gradient(180deg, var(--mini-bg), #eef2ff 55%, var(--mini-bg));
        }

        #app {
            min-height: 100vh;
        }

        .mini-page {
            width: 100%;
            margin: 0 auto;
        }

        .mini-top-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 8px;
        }

        .mini-inline-note {
            border-radius: 10px;
            border: 1px solid var(--mini-note-border);
            background: var(--mini-note-bg);
            color: var(--mini-note-text);
            padding: 8px 10px;
            font-size: 13px;
            font-weight: 500;
        }

        .mini-task-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
        }

        .mini-task-form {
            display: grid;
            gap: 10px;
        }

        .mini-task-title {
            flex: 1;
            font-size: 14px;
            color: var(--mini-text);
        }

        .mini-task-title.done {
            color: #64748b;
            text-decoration: line-through;
        }

        .mini-file-input {
            width: 100%;
            font: inherit;
            font-size: 13px;
            color: #334155;
        }

        .mini-select-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .mini-select-wrap {
            position: relative;
        }

        .mini-select-trigger {
            width: 100%;
            border: 1px solid var(--mini-border);
            border-radius: 10px;
            padding: 10px 12px;
            background: var(--mini-surface);
            color: var(--mini-text);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
        }

        .mini-select-trigger-open {
            border-color: var(--mini-primary);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--mini-primary) 18%, transparent);
        }

        .mini-select-value {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .mini-select-caret {
            font-size: 11px;
            color: #64748b;
        }

        .mini-select-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            z-index: 50;
            border: 1px solid var(--mini-border);
            border-radius: 10px;
            overflow: hidden;
            background: var(--mini-surface);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
        }

        .mini-select-option {
            width: 100%;
            text-align: left;
            border: 0;
            background: var(--mini-surface);
            color: var(--mini-text);
            padding: 10px 12px;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
        }

        .mini-select-option + .mini-select-option {
            border-top: 1px solid var(--mini-border);
        }

        .mini-select-option:hover {
            background: color-mix(in srgb, var(--mini-primary) 8%, white);
        }

        .mini-select-option-active {
            background: color-mix(in srgb, var(--mini-primary) 12%, white);
            color: #1e3a8a;
            font-weight: 600;
        }

        .mini-color-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .mini-action-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .mini-action-btn {
            width: 100%;
            justify-content: center;
            min-height: 40px;
            text-align: center;
        }

        .mini-row-delete {
            min-width: 88px;
            justify-content: center;
        }

        @media (max-width: 640px) {
            .mini-action-grid {
                grid-template-columns: 1fr;
            }

            .mini-color-grid {
                grid-template-columns: 1fr;
            }

            .mini-top-actions {
                width: 100%;
                justify-content: stretch;
            }

            .mini-top-actions .synact-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- Start by opening mini-app.html in your browser. -->
    <script src="./synact.js"></script>
    <script src="./lib/synact.lib.js"></script>
    <script src="./mini-app.js"></script>
</body>
</html>
